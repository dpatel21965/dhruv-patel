<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learn CAD — Dhruv Patel</title>
<meta name="description" content="A deep, illustrated Onshape CAD course: fundamentals, FTC, and FRC — modeled on the Onshape Learning Center and FRCDesign.org." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#F4F5F7" />

<style>
  :root{
    --bg:#F4F5F7; --bg-2:#EDEFF3; --surface:#FFFFFF; --surface-2:#EDEFF3;
    --ink:#1B1E24; --ink-soft:#59616E; --ink-faint:#97A0AD;
    --line:#DEE2E8; --line-2:#CBD2DC;
    --accent:#2456C7; --accent-dim:#1B3E96; --amber:#B26A00; --amber-dim:#8A5200; --red:#D64545;
    --grid:rgba(27,30,36,.045); --glow:rgba(36,86,199,.14);
    --fd:'Archivo',system-ui,sans-serif; --fb:'Hanken Grotesk',system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,monospace;
    --toc:300px; --topbar:60px; --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:var(--fb);color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;margin:0;letter-spacing:-.02em;}
  .mono{font-family:var(--fm);}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:46px 46px;}

  /* topbar */
  .topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:50;display:flex;align-items:center;gap:1rem;padding:0 1.2rem;background:rgba(244,245,247,.82);backdrop-filter:saturate(150%) blur(14px);border-bottom:1px solid var(--line);}
  .back{display:inline-flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--ink-soft);font-weight:500;transition:.2s;}
  .back:hover{color:var(--accent);}
  .back svg{width:16px;height:16px;}
  .tb-title{font-family:var(--fd);font-weight:600;font-size:1rem;}
  .tb-title .mono{color:var(--accent);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;display:block;font-weight:500;}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:1rem;}
  .prog{width:160px;height:6px;background:var(--surface-2);border-radius:100px;overflow:hidden;border:1px solid var(--line);}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--amber));transition:width .4s var(--ease);}
  .prog-l{font-family:var(--fm);font-size:.7rem;color:var(--ink-faint);}
  .menu-btn{display:none;background:none;border:1px solid var(--line-2);border-radius:8px;color:var(--ink);padding:.35rem .5rem;cursor:pointer;}

  /* layout */
  .shell{display:flex;padding-top:var(--topbar);position:relative;z-index:1;}
  aside.toc{position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--toc);overflow-y:auto;border-right:1px solid var(--line);background:var(--bg-2);padding:1.2rem .8rem 3rem;transition:transform .3s var(--ease);}
  aside.toc::-webkit-scrollbar{width:8px;} aside.toc::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;}
  .track-h{font-family:var(--fm);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:1.3rem .6rem .5rem;display:flex;align-items:center;gap:.5rem;}
  .track-h:first-child{margin-top:.2rem;}
  .track-h .n{width:20px;height:20px;border:1px solid var(--accent-dim);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.62rem;color:var(--accent);}
  .unit{margin-bottom:.2rem;}
  .unit-t{font-family:var(--fd);font-weight:600;font-size:.82rem;color:var(--ink-soft);padding:.4rem .6rem;letter-spacing:0;}
  .toc a.lz{display:flex;gap:.55rem;align-items:flex-start;padding:.42rem .6rem .42rem 1.2rem;border-radius:7px;font-size:.85rem;color:var(--ink-soft);transition:.15s;line-height:1.35;}
  .toc a.lz:hover{background:var(--surface);color:var(--ink);}
  .toc a.lz.active{background:rgba(36,86,199,.1);color:var(--accent);}
  .toc a.lz .dot{width:6px;height:6px;border-radius:50%;border:1px solid var(--line-2);margin-top:.45rem;flex-shrink:0;}
  .toc a.lz.active .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px var(--glow);}
  .toc a.lz.done .dot{background:var(--accent-dim);border-color:var(--accent-dim);}

  main.content{margin-left:var(--toc);flex:1;min-width:0;max-width:none;padding:2.4rem max(clamp(1.1rem,4vw,3.5rem),calc((100vw - var(--toc) - 880px)/2)) 5rem;}

  /* lesson page */
  .crumb{font-family:var(--fm);font-size:.72rem;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:.8rem;}
  .crumb b{color:var(--accent);}
  .lesson-h{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:700;letter-spacing:-.03em;}
  .lmeta{display:flex;gap:1.2rem;flex-wrap:wrap;margin:.9rem 0 1.8rem;font-family:var(--fm);font-size:.74rem;color:var(--ink-faint);}
  .lmeta-i{display:inline-flex;align-items:center;gap:.4rem;}
  .lmeta-i svg{width:14px;height:14px;color:var(--accent-dim);}
  .intro{font-size:1.1rem;color:var(--ink-soft);border-left:3px solid var(--accent);padding-left:1.1rem;margin-bottom:2.2rem;}

  .sec{margin-bottom:2.4rem;}
  .sec h2{font-size:1.35rem;font-weight:600;margin-bottom:.4rem;display:flex;align-items:baseline;gap:.6rem;}
  .sec h2 .sx{font-family:var(--fm);font-size:.8rem;color:var(--accent);}
  .sec p{color:var(--ink-soft);margin:.6rem 0;}
  .sec p b{color:var(--ink);}
  .sec p code,.step code{font-family:var(--fm);font-size:.85em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.06rem .38rem;color:var(--accent);}

  figure.fig{margin:1.4rem 0;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  figure.fig .frame{padding:1.4rem;display:flex;justify-content:center;background:radial-gradient(120% 120% at 50% 0%,#FBFCFD,#EEF1F5);}
  figure.fig svg{width:100%;max-width:560px;height:auto;}
  figure.fig figcaption{font-family:var(--fm);font-size:.76rem;color:var(--ink-faint);padding:.7rem 1rem;border-top:1px solid var(--line);display:flex;gap:.5rem;}
  figure.fig figcaption b{color:var(--accent);}

  ol.steps{counter-reset:s;list-style:none;padding:0;margin:1rem 0;display:grid;gap:.7rem;}
  ol.steps li{counter-increment:s;position:relative;padding:.75rem .9rem .75rem 3rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:.94rem;}
  ol.steps li::before{content:counter(s);position:absolute;left:.75rem;top:.7rem;width:1.5rem;height:1.5rem;border-radius:7px;background:rgba(36,86,199,.1);border:1px solid var(--accent-dim);color:var(--accent);font-family:var(--fm);font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;}
  ol.steps li b{color:var(--ink);}

  .callout{border-radius:10px;padding:.85rem 1rem .85rem 1rem;margin:1.2rem 0;font-size:.92rem;border:1px solid var(--line);display:flex;gap:.7rem;}
  .callout svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;}
  .callout .ct{font-family:var(--fm);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:.2rem;}
  .callout.note{background:rgba(36,86,199,.05);border-left:3px solid var(--accent);} .callout.note .ct,.callout.note svg{color:var(--accent);}
  .callout.tip{background:rgba(255,176,32,.05);border-left:3px solid var(--amber);} .callout.tip .ct,.callout.tip svg{color:var(--amber);}
  .callout.warn{background:rgba(255,107,107,.06);border-left:3px solid var(--red);} .callout.warn .ct,.callout.warn svg{color:var(--red);}
  .callout .cbody{color:var(--ink-soft);}

  .takeaways{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:1.2rem 1.4rem;margin:2rem 0;}
  .takeaways h3{font-size:1rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem;}
  .takeaways h3 svg{width:18px;height:18px;color:var(--accent);}
  .takeaways ul{margin:0;padding-left:1.1rem;display:grid;gap:.35rem;}
  .takeaways li{font-size:.9rem;color:var(--ink-soft);} .takeaways li::marker{color:var(--accent);}

  .resources{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.4rem 0;}
  .res{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--fm);font-size:.8rem;color:var(--accent);border:1px solid var(--accent-dim);background:rgba(36,86,199,.05);padding:.5rem .8rem;border-radius:8px;transition:.18s;}
  .res:hover{background:var(--accent);color:#fff;} .res svg{width:15px;height:15px;}

  .pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.6rem;border-top:1px solid var(--line);}
  .pg{flex:1;max-width:48%;border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem;transition:.2s;cursor:pointer;}
  .pg:hover{border-color:var(--accent-dim);background:var(--surface);}
  .pg.next{text-align:right;margin-left:auto;} .pg.disabled{opacity:.3;pointer-events:none;}
  .pg .k{font-family:var(--fm);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  .pg .t{font-family:var(--fd);font-weight:600;font-size:.95rem;color:var(--ink);margin-top:.2rem;}

  .scrim{display:none;position:fixed;inset:var(--topbar) 0 0;background:rgba(27,30,36,.35);z-index:40;}
  html[data-theme="dark"]{--bg:#0E1116;--bg-2:#151A21;--surface:#151A21;--surface-2:#1B222B;--ink:#E9EDF2;--ink-soft:#A7B0BE;--ink-faint:#6C7686;--line:#26303C;--line-2:#33404E;--accent:#7EA6FF;--accent-dim:#5B84E0;--amber:#E3A54A;--red:#FF7A7A;--grid:rgba(255,255,255,.045);--glow:rgba(126,166,255,.18);}
  html[data-theme="dark"] .topbar{background:rgba(14,17,22,.82);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .theme-tog{background:none;border:1px solid var(--line-2);border-radius:8px;color:var(--ink-soft);width:34px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s var(--ease);}
  .theme-tog:hover{border-color:var(--accent);color:var(--accent);}
  .theme-tog svg{width:15px;height:15px;}
  .theme-tog .moon{display:none;} html[data-theme="dark"] .theme-tog .sun{display:none;} html[data-theme="dark"] .theme-tog .moon{display:inline;}
  @media (max-width:900px){
    :root{--toc:280px;}
    .menu-btn{display:block;} .prog{width:90px;}
    aside.toc{transform:translateX(-100%);z-index:45;box-shadow:0 0 40px rgba(27,30,36,.16);}
    aside.toc.open{transform:none;} .scrim.open{display:block;}
    main.content{margin-left:0;}
    .pg{max-width:48%;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

<div class="topbar">

  <div class="tb-title"><span class="mono">Learn CAD</span><span id="tbLesson">Onshape from zero to competition robot</span></div>

    <button class="menu-btn" id="menuBtn" aria-label="Outline"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </div>
</div>

<div class="shell">

  <main class="content" id="page"></main>
</div>
<div class="scrim" id="scrim"></div>

 endconditions:S("0 0 560 180",`

 detail:S("0 0 560 210",`

const COURSE=[
 {id:"fund", n:"01", title:"Onshape Fundamentals", units:[
   {title:"Getting Started", lessons:[
     {id:"f-ui", title:"The Onshape interface & cloud model", min:12, intro:"Onshape runs entirely in your browser — nothing to install, and your work saves continuously. Before you model anything, get comfortable with the window and the way Onshape stores your data, because it's unlike any file-based CAD you may have seen.",
      sec:[
        {h:"Tour the window", x:"1", fig:"interface", body:"Every Onshape document is a set of <b>tabs</b> along the bottom. The three you'll use constantly are <b>Part Studios</b> (model parts), <b>Assemblies</b> (mate parts together), and <b>Drawings</b> (dimension for manufacturing). The toolbar at the top changes to match whichever tab is open. On the left is the <b>Feature list</b> — the ordered recipe that builds your part. The big area in the middle is the graphics area where your model lives.",
         steps:["Go to <code>onshape.com</code> and create a free <b>Education</b> or <b>Maker</b> account.","Click <b>Create → Document</b> and give it a name.","Add a Part Studio, an Assembly, and a Drawing tab so you've seen all three.","Practice the camera: <b>right-drag</b> to orbit, <b>Ctrl/⌘-drag</b> to pan, <b>scroll</b> to zoom."]},
        {h:"The cloud data model", x:"2", body:"There is no Save button. A <b>workspace</b> is your live editing area; a <b>version</b> is a permanent snapshot you can always return to; a <b>branch</b> lets you try a change without touching the main design. This is why you can't lose work and why a whole team can edit the same document at once.",
         steps:["Make any edit, then open <b>Versions &amp; history</b> (the clock icon).","Create a <b>version</b> and name it clearly, e.g. <code>v1 — base frame</code>.","Right-click that version and <b>branch</b> from it to experiment safely.","Use <b>Compare</b> to see exactly what changed between two versions."]},
      ],
      notes:[["tip","Take a named version before any big change — it's your instant, permanent undo point."]],
      take:["Onshape is browser-based and auto-saving.","Documents hold Part Studio, Assembly, and Drawing tabs.","Versions and branches let you experiment without ever losing work."],
      res:[["Onshape Learning Center","https://learn.onshape.com/",false],["Onshape on YouTube","https://www.youtube.com/@Onshape",true]]},
   ]},
   {title:"Sketching", lessons:[
     {id:"f-sketch", title:"Your first sketch: planes & tools", min:14, intro:"Every 3D feature starts as a 2D sketch on a flat plane. Sketching well is the single most important CAD skill — a clean sketch makes everything downstream easy; a messy one causes problems you'll fight for hours.",
      sec:[
        {h:"Choose a plane", x:"1", fig:"planes", body:"Onshape gives you three default planes — <b>Top</b>, <b>Front</b>, and <b>Right</b> — that meet at the <b>origin</b>. You can also sketch on any flat face of an existing part. Pick the plane that matches how you'll think about the part (usually Front for a profile you'll extrude toward you).",
         steps:["Click <b>Sketch</b>, then click the <b>Front</b> plane.","The view snaps flat to the plane — you're now drawing in 2D.","Anchor your first geometry to the <b>origin</b> so the part stays put."]},
        {h:"Draw the geometry", x:"2", fig:"sketchDraw", body:"Use <b>line</b>, <b>rectangle</b>, <b>circle</b>, <b>arc</b>, and <b>spline</b> to lay out the shape. Draw roughly to size — you'll pin exact dimensions in the next lesson. Keep each sketch to one feature's worth of geometry.",
         steps:["Draw a <b>rectangle</b> starting near the origin.","Add a <b>circle</b> for a hole or boss.","Press <b>Esc</b> to drop the tool; press it again to leave the tool active for another shape."]},
      ],
      notes:[["note","Model one feature's worth of geometry per sketch. Cramming a whole part into one giant sketch makes it fragile and hard to edit."],["warn","Don't leave gaps — an open profile can't be extruded into a solid. Use the <b>Sketch</b> panel's warning to spot open loops."]],
      take:["Sketches live on planes or flat faces.","Anchor to the origin to keep the model stable.","Draw roughly; dimension precisely afterward."],
      res:[["Onshape Learning Center","https://learn.onshape.com/",false]]},
     {id:"f-constraints", title:"Constraints & dimensions: fully defining", min:12, intro:"A sketch is 'fully defined' when every point is locked in place — Onshape colors it black. Anything still free is blue, and blue geometry will move on you when you least expect it. Your goal is black on every sketch.",
      sec:[
        {h:"Constrain, then dimension", x:"1", fig:"constraints", body:"<b>Constraints</b> describe relationships — coincident, parallel, perpendicular, tangent, <b>equal</b>, symmetric, horizontal/vertical. <b>Dimensions</b> set actual numbers. Add constraints first (they remove lots of freedom cheaply), then add just enough dimensions to lock the rest.",
         steps:["Add <b>horizontal</b>/<b>vertical</b> constraints to straighten lines.","Use <b>equal</b> to make two edges match with a single constraint.","Add <b>symmetric</b> about the origin so the part stays centered.","Dimension the remaining unknowns until the sketch turns <b>black</b>."]},
      ],
      notes:[["tip","If a sketch won't go fully defined, look for a blue point you can drag — wherever it moves is the freedom you still need to pin."],["warn","Never over-constrain. If Onshape warns of conflicting constraints, remove one rather than forcing a dimension."]],
      take:["Blue = under-defined (can move); black = fully defined.","Constraints are cheaper than dimensions — use them first.","Fully define every sketch before building on it."],
      res:[["Onshape on YouTube","https://www.youtube.com/@Onshape",true]]},
   ]},
   {title:"Part features", lessons:[
     {id:"f-extrude", title:"Extrude & end conditions", min:12, intro:"Extrude is the workhorse of solid modeling: it pushes a 2D sketch into the third dimension to add material, or pulls it through a solid to cut a pocket or hole.",
      sec:[
        {h:"Add material", x:"1", fig:"extrude", body:"Select a closed sketch region and choose <b>Extrude</b>. Drag the arrow or type a depth. The same tool has an <b>Add</b> mode (new solid) and a <b>Remove</b> mode (cut).",
         steps:["Select a closed region and click <b>Extrude</b>.","Set a <b>blind</b> depth, then try <b>Symmetric</b> to grow both ways.","Sketch a circle on a face and <b>Extrude → Remove</b> to cut a hole.","Rename the feature in the tree, e.g. <code>Base plate</code>."]},
        {h:"End conditions", x:"2", fig:"endconditions", body:"Beyond blind depth, use <b>Up to face</b>, <b>Up to part</b>, or <b>Through all</b> so the feature adapts if the model changes — far more robust than a hard-coded number.",
         steps:["Try <b>Up to face</b> on a cut so it always reaches the far wall.","Use <b>Through all</b> for bolt holes that must fully pierce the part."]},
      ],
      notes:[["tip","Name features as you go ('Bolt holes', 'Lightening pockets'). A tree that reads like a recipe is a gift to your future self and teammates."]],
      take:["Extrude adds or removes material from a sketch region.","End conditions like 'up to face' keep features robust to change.","Name every feature."],
      res:[["Onshape Learning Center","https://learn.onshape.com/",false]]},
     {id:"f-revolve", title:"Revolve & reading the feature tree", min:10, intro:"Revolve spins a profile around an axis to make anything cylindrical — shafts, wheels, spacers, bosses. It's also the perfect moment to understand how the feature tree rebuilds.",
      sec:[
        {h:"Revolve a profile", x:"1", fig:"revolve", body:"Sketch a <b>half-profile</b> and a <b>centerline</b> to act as the axis, then Revolve, usually 360°.",
         steps:["Sketch the half-profile of a stepped shaft plus a centerline axis.","Click <b>Revolve</b>, pick the axis, and set 360°.","Add a <b>chamfer</b> to the shaft ends for assembly lead-in."]},
        {h:"The rollback bar", x:"2", fig:"tree", body:"The feature list runs top-to-bottom. Drag the <b>rollback bar</b> up to step back in time, insert a feature earlier, then roll forward and watch everything rebuild in order.",
         steps:["Drag the rollback bar above a feature.","Edit an earlier sketch and roll forward to see changes propagate.","If a feature turns red, fix the <b>cause</b> upstream, not the symptom."]},
      ],
      notes:[["note","Order matters. Features only 'see' geometry created before them, which is why a broken feature is usually fixed by editing something earlier in the tree."]],
      take:["Revolve builds cylindrical geometry from a profile + axis.","The tree rebuilds top-to-bottom; rollback lets you edit history.","Fix broken features upstream."],
      res:[["Onshape on YouTube","https://www.youtube.com/@Onshape",true]]},
   ]},
   {title:"Detailing & reuse", lessons:[
     {id:"f-detail", title:"Fillets, chamfers, holes & shell", min:12, intro:"These are the details that turn a rough block into a real, manufacturable part — stronger, safer, and ready to assemble.",
      sec:[
        {h:"Round, bevel, bore, hollow", x:"1", fig:"detail", body:"<b>Fillets</b> round edges (strength + safety), <b>chamfers</b> bevel them (assembly lead-ins, deburring). The <b>Hole</b> tool is smarter than a cut — it understands clearance, tapped, counterbore, and countersink holes. <b>Shell</b> hollows a solid to a wall thickness for printed parts.",
         steps:["Add a 2–3 mm <b>fillet</b> to load-bearing edges.","Add a 45° <b>chamfer</b> to a hole's lead-in edge.","Use the <b>Hole</b> tool for a counterbored M3 bolt hole.","<b>Shell</b> an enclosure to 2 mm walls, removing the top face."]},
        {h:"Patterns & variables", x:"2", fig:"pattern", body:"Never place repeated features by hand. <b>Linear</b>, <b>circular</b>, and <b>mirror</b> patterns copy a feature cleanly, and <b>variables</b> like <code>#count</code> or <code>#width</code> let one number drive many dimensions.",
         steps:["Pattern a vent-slot array with a <b>linear pattern</b>.","Put a bolt circle on a <b>circular pattern</b>.","Define <code>#width</code> and reference it in several dimensions."]},
      ],
      notes:[["tip","Add fillets and chamfers LAST. They turn edges into curved faces that are harder to select for earlier features."],["warn","Walls thinner than ~1.2 mm print poorly on FDM. Keep structural walls thicker."]],
      take:["Fillet/chamfer/hole/shell make parts manufacturable.","Patterns and variables keep repeated geometry clean and editable.","Detail features go last."],
      res:[["Onshape Learning Center","https://learn.onshape.com/",false]]},
     {id:"f-config", title:"Configurations & part libraries", min:10, intro:"Once you can model a part, make it reusable. Configurations turn a part into a size family; a library keeps purchased and common parts in one place.",
      sec:[
        {h:"Configure a family", x:"1", fig:"config", body:"A <b>configuration</b> turns inputs (length, hole count, variant) into a selectable table, so one bracket serves every size you need.",
         steps:["Add a configuration input such as <b>length</b>.","Build a config table with a few sizes.","Insert different configurations into an assembly to confirm they swap."]},
        {h:"Build a team library", x:"2", body:"Keep COTS parts and your own reusable parts in a dedicated <b>library document</b>, then insert them everywhere. Updates propagate, and every project stays consistent. This is also your first taste of <b>FeatureScript</b>, Onshape's language for custom features.",
         steps:["Create a <code>Team Library</code> document.","Import vendor STEP files into it, one tab per vendor.","Insert library parts via <b>Insert → from other document</b>."]},
      ],
      notes:[["note","Configure a part once instead of modeling it in three sizes. The time you save compounds across a whole robot."]],
      take:["Configurations create size families from one model.","A library document keeps COTS + common parts consistent.","FeatureScript powers custom, reusable features."],
      res:[["Onshape Learning Center","https://learn.onshape.com/",false]]},
   ]},
   {title:"Assemblies & drawings", lessons:[
     {id:"f-mates", title:"Assemblies: mate connectors & joints", min:14, intro:"An Assembly brings parts together and defines how they connect and move. Onshape's mates are built on Mate Connectors — small coordinate frames you place on geometry — which makes assembling fast and predictable once it clicks.",
      sec:[
        {h:"Fasten parts together", x:"1", fig:"mateConn", body:"Insert parts (the first one grounds automatically). Place a <b>Mate Connector</b> on each part where they should meet, then a <b>Fastened</b> mate locks them rigidly (0 degrees of freedom).",
         steps:["Create an Assembly and <b>insert</b> your base part.","Insert a second part.","Place mate connectors on the mating faces of each.","Apply a <b>Fastened</b> mate to lock them together."]},
        {h:"Add motion", x:"2", fig:"joints", body:"For moving mechanisms use a <b>Revolute</b> mate (one rotation — hinge, wheel), a <b>Slider</b> (one translation — linear slide), or Cylindrical/Planar/Ball. After mating, grab and drag to test the motion.",
         steps:["Add a <b>Revolute</b> mate to a hinge or wheel axle.","Drag the part to confirm it rotates and nothing else moves.","Group repeated parts into <b>sub-assemblies</b> to stay organized."]},
      ],
      notes:[["tip","Good mate-connector placement is 90% of a clean assembly. Put connectors on real, meaningful geometry (hole centers, face centers), not random points."],["warn","Leftover degrees of freedom make floppy assemblies. Add exactly enough mates — no more, no less."]],
      take:["Mate connectors are the foundation of Onshape assemblies.","Fastened = rigid; revolute/slider add controlled motion.","Sub-assemblies keep big robots manageable."],
      res:[["Onshape on YouTube","https://www.youtube.com/@Onshape",true]]},
     {id:"f-drawings", title:"Drawings & data export", min:12, intro:"A drawing turns your 3D model into a manufacturable 2D document, and exports hand your geometry to the machine that will make it. Even in a print-and-CNC world, a clear drawing prevents costly mistakes.",
      sec:[
        {h:"Make a drawing", x:"1", fig:"views", body:"Create a Drawing, place standard <b>views</b> (front/top/right/iso), then add <b>section</b> and <b>detail</b> views, dimensions, a title block, and a BOM.",
         steps:["Create a <b>Drawing</b> from your part or assembly.","Place front, top, right, and isometric views.","Dimension the features the machinist must hit — and only those.","Add tolerances where they matter; insert a <b>BOM</b> for assemblies."]},
        {h:"Export for manufacturing", x:"2", fig:"exports", body:"Different processes want different files: <b>STEP</b> for CNC/CAD exchange, <b>STL</b> for 3D printing, and <b>DXF</b> for laser cutters and routers (right-click a flat face → Export as DXF).",
         steps:["Right-click a part → <b>Export → STEP</b> for machining.","Export <b>STL</b> at fine resolution for printing.","Right-click a flat face → <b>Export as DXF</b> for the laser."]},
      ],
      notes:[["warn","Always confirm units (mm vs in) before sending a file to a machine, and sanity-check DXFs in the cutter's software — kerf and scale bite here."]],
      take:["Drawings communicate manufacturing intent with views + dimensions.","Dimension what the machinist needs, not every edge.","STEP → CNC, STL → print, DXF → laser/router."],
      res:[["Onshape Learning Center","https://learn.onshape.com/",false]]},

 {id:"ftc", n:"02", title:"FTC CAD", units:[

   {title:"Drivetrain & custom parts", lessons:[

 {id:"frc", n:"03", title:"FRC CAD", units:[

      sec:[

/* =========================================================================
   RENDER + ROUTING
   ========================================================================= */
// flatten lessons for prev/next and progress
const FLAT=[];
COURSE.forEach(tr=>tr.units.forEach(u=>u.lessons.forEach(l=>FLAT.push({tr,u,l}))));
const idxOf=id=>FLAT.findIndex(x=>x.l.id===id);
const visited=new Set();

const iconClock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>';
const iconLayers='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5-10-5ZM2 16l10 5 10-5M2 12l10 5 10-5"/></svg>';
const iconKey='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM9 11l6 6 3-3-2-2 2-2-3-3"/></svg>';
const iconNote='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
const iconTip='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c1 1 1.3 1.6 1.5 3h5c.2-1.4.5-2 1.5-3a6 6 0 0 0-4-10Z"/></svg>';
const iconWarn='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>';
const cicon={note:iconNote,tip:iconTip,warn:iconWarn};

function buildTOC(){
  const el=document.getElementById('toc');
  el.innerHTML=COURSE.map(tr=>`
    <div class="track-h"><span class="n">${tr.n}</span>${tr.title}</div>
    ${tr.units.map(u=>`<div class="unit"><div class="unit-t">${u.title}</div>
      ${u.lessons.map(l=>`<a class="lz" data-id="${l.id}" href="#${l.id}"><span class="dot"></span><span>${l.title}</span></a>`).join('')}
    </div>`).join('')}
  `).join('');
}

function renderLesson(id){
  const i=idxOf(id); if(i<0) return;
  const {tr,u,l}=FLAT[i];
  visited.add(id);
  const secs=l.sec.map(s=>`
    <div class="sec">
      <h2><span class="sx">${s.x}</span>${s.h}</h2>
      ${s.body?`<p>${s.body}</p>`:''}
      ${s.fig?`<figure class="fig"><div class="frame">${FIG[s.fig]||''}</div><figcaption><b>FIG ${l.sec.indexOf(s)+1}</b> ${s.h}</figcaption></figure>`:''}
      ${s.steps?`<ol class="steps">${s.steps.map(t=>`<li>${t}</li>`).join('')}</ol>`:''}
    </div>`).join('');
  const notes=(l.notes||[]).map(([t,x])=>`<div class="callout ${t}">${cicon[t]}<div><span class="ct">${t==='warn'?'Watch out':t}</span><span class="cbody">${x}</span></div></div>`).join('');
  const take=l.take?`<div class="takeaways"><h3>${iconKey} Key takeaways</h3><ul>${l.take.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:'';
  const res=l.res?`<div class="resources">${l.res.map(([t,uu,yt])=>`<a class="res" href="${uu}" target="_blank" rel="noopener">${yt?YT:LK} ${t}</a>`).join('')}</div>`:'';
  const prev=FLAT[i-1], next=FLAT[i+1];
  const pager=`<div class="pager">
    ${prev?`<div class="pg prev" data-go="${prev.l.id}"><div class="k">‹ Previous</div><div class="t">${prev.l.title}</div></div>`:`<div class="pg prev disabled"><div class="k">‹ Previous</div><div class="t">Start of course</div></div>`}
    ${next?`<div class="pg next" data-go="${next.l.id}"><div class="k">Next ›</div><div class="t">${next.l.title}</div></div>`:`<div class="pg next disabled"><div class="k">Next ›</div><div class="t">End of course</div></div>`}
  </div>`;
  document.getElementById('page').innerHTML=`
    <div class="crumb"><b>${tr.title}</b> &nbsp;/&nbsp; ${u.title}</div>
    <h1 class="lesson-h">${l.title}</h1>
    <div class="lmeta">
      <span class="lmeta-i">${iconLayers} Lesson ${i+1} of ${FLAT.length}</span>
      <span class="lmeta-i">${iconClock} ${l.min} min read</span>
    </div>
    <p class="intro">${l.intro}</p>
    ${secs}${notes}${take}${res}${pager}`;
  document.getElementById('tbLesson').textContent=l.title;
  // toc active + done state
  document.querySelectorAll('.toc .lz').forEach(a=>{
    a.classList.toggle('active',a.dataset.id===id);
    if(visited.has(a.dataset.id)) a.classList.add('done');
  });
  const active=document.querySelector('.toc .lz.active'); if(active) active.scrollIntoView({block:'nearest'});
  const pct=Math.round(visited.size/FLAT.length*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progL').textContent=pct+'%';
  window.scrollTo(0,0);
  closeMenu();
}

// nav wiring
document.getElementById('page').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;}});
addEventListener('hashchange',()=>{const id=location.hash.slice(1); if(idxOf(id)>=0) renderLesson(id);});

// mobile menu
const toc=document.getElementById('toc'), scrim=document.getElementById('scrim');
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('open');}
document.getElementById('menuBtn').addEventListener('click',()=>{toc.classList.toggle('open');scrim.classList.toggle('open');});
scrim.addEventListener('click',closeMenu);

buildTOC();
const start=location.hash.slice(1);
renderLesson(idxOf(start)>=0?start:FLAT[0].l.id);
</script>
<script>(function(){var tg=document.getElementById("themeTog");if(tg)tg.addEventListener("click",function(){var d=document.documentElement.getAttribute("data-theme")==="dark";if(d){document.documentElement.removeAttribute("data-theme");try{localStorage.setItem("dp-theme","");}catch(e){}}else{document.documentElement.setAttribute("data-theme","dark");try{localStorage.setItem("dp-theme","dark");}catch(e){}}});})();</script>
</body>
</html>
